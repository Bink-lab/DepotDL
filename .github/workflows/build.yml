name: Build and Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.2.0
        with:
          dotnet-version: '9.0.x'

      - name: Compute version
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.0.0"
          }
          "DEPOTDL_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build DepotDL CLI (Windows)
        working-directory: DepotDL.CLI
        run: .\build.bat
        env:
          CI: true

      - name: Build DepotDL GUI (Windows)
        working-directory: DepotDL.GUI
        run: .\build.bat
        env:
          CI: true

      - name: Package CLI (Windows)
        shell: pwsh
        run: Compress-Archive -Path DepotDL.CLI/bin/Release/net9.0/win-x64/publish/* -DestinationPath cli-windows.zip -Force

      - name: Package GUI (Windows)
        shell: pwsh
        run: Compress-Archive -Path DepotDL.GUI/bin/Release/net9.0/win-x64/publish/* -DestinationPath gui-windows.zip -Force

      - name: Install vpk tool
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Pack GUI with Velopack
        shell: pwsh
        run: |
          vpk pack `
            --packId DepotDL `
            --packVersion $env:DEPOTDL_VERSION `
            --packDir DepotDL.GUI/bin/Release/net9.0/win-x64/publish `
            --mainExe DepotDL.GUI.exe `
            --packTitle "DepotDL" `
            --outputDir velopack_releases

      - name: Upload CLI (Windows)
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.6.0
        with:
          name: cli-windows
          path: cli-windows.zip

      - name: Upload GUI (Windows)
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.6.0
        with:
          name: gui-windows
          path: gui-windows.zip

      - name: Upload Velopack Installer
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.6.0
        with:
          name: velopack
          path: velopack_releases/

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.2.0
        with:
          dotnet-version: '9.0.x'

      - name: Compute version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="0.0.0"
          fi
          echo "DEPOTDL_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build DepotDL CLI (Linux)
        working-directory: DepotDL.CLI
        run: |
          chmod +x build.sh
          ./build.sh
        env:
          CI: true

      - name: Build DepotDL GUI (Linux)
        working-directory: DepotDL.GUI
        run: |
          chmod +x build.sh
          ./build.sh linux-x64
        env:
          CI: true

      - name: Package CLI (Linux)
        run: |
          chmod +x DepotDL.CLI/bin/Release/net9.0/linux-x64/publish/DepotDL.CLI
          zip -j cli-linux.zip DepotDL.CLI/bin/Release/net9.0/linux-x64/publish/*

      - name: Package GUI (Linux)
        run: |
          chmod +x DepotDL.GUI/bin/Release/net9.0/linux-x64/publish/DepotDL.GUI
          zip -j gui-linux.zip DepotDL.GUI/bin/Release/net9.0/linux-x64/publish/*

      - name: Upload CLI (Linux)
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.6.0
        with:
          name: cli-linux
          path: cli-linux.zip

      - name: Upload GUI (Linux)
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.6.0
        with:
          name: gui-linux
          path: gui-linux.zip

      - name: Install vpk tool
        continue-on-error: true
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Pack GUI with Velopack (Linux)
        continue-on-error: true
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          vpk pack \
            --packId DepotDL \
            --packVersion "$DEPOTDL_VERSION" \
            --packDir DepotDL.GUI/bin/Release/net9.0/linux-x64/publish \
            --mainExe DepotDL.GUI \
            --packTitle "DepotDL" \
            --outputDir velopack_releases

      - name: Upload Velopack Installer (Linux)
        continue-on-error: true
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.6.0
        with:
          name: velopack-linux
          path: velopack_releases/

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.2.0
        with:
          dotnet-version: '9.0.x'

      - name: Compute version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="0.0.0"
          fi
          echo "DEPOTDL_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build DepotDL CLI (macOS)
        working-directory: DepotDL.CLI
        run: |
          chmod +x build.sh
          ./build.sh osx-arm64
        env:
          CI: true

      - name: Build DepotDL GUI (macOS)
        working-directory: DepotDL.GUI
        run: |
          chmod +x build.sh
          ./build.sh osx-arm64
        env:
          CI: true

      - name: Package CLI (macOS)
        run: |
          chmod +x DepotDL.CLI/bin/Release/net9.0/osx-arm64/publish/DepotDL.CLI
          zip -j cli-macos.zip DepotDL.CLI/bin/Release/net9.0/osx-arm64/publish/*

      - name: Package GUI (macOS)
        run: |
          chmod +x DepotDL.GUI/bin/Release/net9.0/osx-arm64/publish/DepotDL.GUI
          zip -j gui-macos.zip DepotDL.GUI/bin/Release/net9.0/osx-arm64/publish/*

      - name: Upload CLI (macOS)
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.6.0
        with:
          name: cli-macos
          path: cli-macos.zip

      - name: Upload GUI (macOS)
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.6.0
        with:
          name: gui-macos
          path: gui-macos.zip

      - name: Install vpk tool
        continue-on-error: true
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Pack GUI with Velopack (macOS)
        continue-on-error: true
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          vpk pack \
            --packId DepotDL \
            --packVersion "$DEPOTDL_VERSION" \
            --packDir DepotDL.GUI/bin/Release/net9.0/osx-arm64/publish \
            --mainExe DepotDL.GUI \
            --packTitle "DepotDL" \
            --outputDir velopack_releases

      - name: Upload Velopack Installer (macOS)
        continue-on-error: true
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.6.0
        with:
          name: velopack-macos
          path: velopack_releases/

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        id: generate_notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --exclude 'nightly-*' "${GITHUB_REF_NAME}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "Using $PREVIOUS_TAG as base for changelog"

          {
            echo "## DepotDL ${GITHUB_REF_NAME}"
            echo ""
            CHANGES=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"* %s (%h)")
            if [ -z "$CHANGES" ]; then
              echo "No changes since $PREVIOUS_TAG."
            else
              echo "### Changes since $PREVIOUS_TAG"
              echo "$CHANGES"
            fi
            echo ""
            echo "**Compare:** https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...${GITHUB_REF_NAME}"
          } > release_notes.md

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir release_assets
          cp artifacts/cli-windows/cli-windows.zip release_assets/DepotDL.CLI-Windows-x64-$VERSION.zip
          cp artifacts/gui-windows/gui-windows.zip release_assets/DepotDL.GUI-Windows-x64-$VERSION.zip
          cp artifacts/cli-linux/cli-linux.zip     release_assets/DepotDL.CLI-Linux-x64-$VERSION.zip
          cp artifacts/gui-linux/gui-linux.zip     release_assets/DepotDL.GUI-Linux-x64-$VERSION.zip
          cp artifacts/cli-macos/cli-macos.zip     release_assets/DepotDL.CLI-macOS-arm64-$VERSION.zip
          cp artifacts/gui-macos/gui-macos.zip     release_assets/DepotDL.GUI-macOS-arm64-$VERSION.zip
          cp -r artifacts/velopack/.               release_assets/
          [ -d artifacts/velopack-linux ] && cp -r artifacts/velopack-linux/. release_assets/ || true
          [ -d artifacts/velopack-macos ] && cp -r artifacts/velopack-macos/. release_assets/ || true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DepotDL ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: false
          files: release_assets/*
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
